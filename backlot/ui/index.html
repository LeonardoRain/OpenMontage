<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot — 项目库</title>
<link rel="stylesheet" href="/ui/board.css">
</head>
<body>
<div class="wrap">
  <header class="slate">
    <div class="clapper"></div>
    <div>
      <span class="wordmark">Backlot</span>
      <h1 data-i18n="Library">项目库</h1>
    </div>
    <span class="chip" id="count"></span>
    <div class="spacer"></div>
    <span class="live idle" id="liveBadge"><span class="dot"></span><span id="liveText">空闲</span></span>
  </header>
  <div class="lib-grid" id="grid"></div>
  <p class="hint" id="empty" data-i18n="No projects yet — run a production and it will appear here." style="display:none">还没有项目 —— 开始一次视频制作后，项目会出现在这里。</p>
</div>
<script type="module" src="/ui/library.js"></script>
</body>
</html>
